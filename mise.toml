[tools]
"npm:agent-browser" = "0.35.0"
ast-grep = "0.45.2"
aws-cli = { version = "2.36.36", symlink_bins = "true" }
bun = "latest"
"cargo:caligula" = "0.4.8"
claude = "2.1.252"
codex = "0.152.0"
delta = "0.19.2"
difftastic = { version = "0.70.0", exe = "difft" }
"cargo:diskonaut" = "0.11.0"
"go:github.com/grafana/gcx/cmd/gcx" = "1.1.1"
gh = "latest"
"http:git-gtr" = { version = "2.10.0", url = "https://github.com/coderabbitai/git-worktree-runner/archive/refs/tags/v{{ version }}.tar.gz", strip_components = 1, version_list_url = "https://api.github.com/repos/coderabbitai/git-worktree-runner/tags?per_page=100", version_json_path = ".[].name" }
gitleaks = "latest"
go = "1.24.4"
"pipx:harlequin" = "2.5.2"
"github:ogulcancelik/herdr" = "0.8.2"
heroku = "11.10.0"
"npm:hunkdiff" = "latest"
"pipx:ipython" = "9.12.0"
"pipx:jira-genie" = "0.4.0"
"go:github.com/jorgerojas26/lazysql" = "0.5.0"
"pipx:magic-beans" = "0.7.0"
"cargo:mergiraf" = "0.18.0"
"npm:napkin-ai" = "0.8.3"
node = "24.11.1"
pi = "0.84.3"
"pipx:posting" = "2.9.2"
pre-commit = "4.6.2"
python = "3.13"
"github:codersauce/red" = "0.6.0"
"pipx:ruff" = "0.16.4"
rust = "stable"
sd = "1.1.0"
shellcheck = "0.11.0"
terraform = "1.15"
terragrunt = "1.1.3"
tflint = "latest"
uv = "0.12.5"
mutagen = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "terraform", "terragrunt"]
install_before = "7d"

[tasks]
bumpi = "mise up --bump -i"
