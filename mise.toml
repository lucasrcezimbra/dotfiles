[tools]
aws-cli = { version = "2.36.24", symlink_bins = "true" }
ast-grep = "0.45.1"
"cargo:caligula" = "0.4.8"
"cargo:diskonaut" = "0.11.0"
"cargo:mergiraf" = "0.18.0"
delta = "0.19.2"
difftastic = { version = "0.70.0", exe = "difft" }
go = "1.24.4"
"go:github.com/grafana/gcx/cmd/gcx" = "1.0.0"
"go:github.com/jorgerojas26/lazysql" = "0.5.0"
node = "24.11.1"
"npm:@earendil-works/pi-coding-agent" = "0.84.1"
"npm:@openai/codex" = "0.147.0"
"npm:napkin-ai" = "0.8.3"
"pipx:harlequin" = "2.5.2"
"pipx:ipython" = "9.12.0"
"pipx:jira-genie" = "0.4.0"
"pipx:magic-beans" = "0.7.0"
"pipx:posting" = "2.9.2"
"pipx:ruff" = "0.16.2"
pre-commit = "4.6.1"
python = "3.13"
rust = "stable"
sd = "1.1.0"
shellcheck = "0.11.0"
uv = "0.12.3"
terragrunt = "1.1.2"
terraform = "1.15"
heroku = "11.9.0"
"github:ogulcancelik/herdr" = "0.8.0"
"http:git-gtr" = { version = "2.10.0", url = "https://github.com/coderabbitai/git-worktree-runner/archive/refs/tags/v{{ version }}.tar.gz", strip_components = 1, version_list_url = "https://api.github.com/repos/coderabbitai/git-worktree-runner/tags?per_page=100", version_json_path = ".[].name" }
tflint = "latest"
gitleaks = "latest"
bun = "latest"
"npm:hunkdiff" = "latest"
"github:codersauce/red" = "0.6.0"

[settings]
idiomatic_version_file_enable_tools = ["node"]
install_before = "7d"

[tasks]
bumpi = "mise up --bump -i"
