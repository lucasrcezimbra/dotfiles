[tools]
"npm:agent-browser" = "0.38.1"
ast-grep = "0.45.3"
aws-cli = { version = "2.37.1", symlink_bins = "true" }
bun = "latest"
"cargo:caligula" = "0.5.0"
claude = "2.1.280"
codex = "0.154.0"
delta = "0.19.2"
difftastic = { version = "0.70.0", exe = "difft" }
"cargo:diskonaut" = "0.11.0"
"go:github.com/grafana/gcx/cmd/gcx" = "1.3.0"
gh = "latest"
"http:git-gtr" = { version = "2.10.0", url = "https://github.com/coderabbitai/git-worktree-runner/archive/refs/tags/v{{ version }}.tar.gz", strip_components = 1, version_list_url = "https://api.github.com/repos/coderabbitai/git-worktree-runner/tags?per_page=100", version_json_path = ".[].name" }
gitleaks = "latest"
go = "1.27.1"
"github:ogulcancelik/herdr" = "0.9.1"
heroku = "11.10.0"
"pipx:ipython" = "9.17.1"
"cargo:mergiraf" = "0.19.1"
node = "26.9.0"
pi = "0.87.1"
pre-commit = "4.6.2"
python = "3.14"
"pipx:ruff" = "0.16.8"
rust = "stable"
sd = "1.1.0"
shellcheck = "0.11.0"
terraform = "1.16"
terragrunt = "1.1.5"
tflint = "latest"
uv = "0.12.15"
mutagen = "latest"
pnpm = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "terraform", "terragrunt"]
install_before = "7d"

[tasks]
bumpi = "mise up --bump -i"
